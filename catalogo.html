<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | CampusShop</title>
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/funcional.css">
</head>

<body>
    <header class="header">

        <input type="checkbox" id="buscador-desplegable">

        <label for="buscador-desplegable" class="icon buscar" aria-label="Buscar">🔍</label>

        <h1 class="titulo">Catálogo</h1>

        <a href="carrito.html" class="icon carrito" aria-label="Carrito">🛒</a>

        <div class="buscador" role="search">
          <input type="search" id="busqueda" maxlength="80" placeholder="Buscar..." aria-label="Buscar productos">
          <label for="buscador-desplegable" class="icon cerrar" aria-label="Cerrar búsqueda">✖</label>
        </div>

    </header>

    <noscript><p>El catálogo necesita JavaScript para mostrar los productos.</p></noscript>

    <div class="categorias-chips" id="categorias" role="group" aria-label="Categorías"></div>

    <section class="filtros" id="filtros" aria-label="Filtros"></section>

    <div class="barra-resultados">
      <span id="resumen" aria-live="polite"></span>
      <button type="button" class="enlace-limpiar" id="limpiar" hidden>Limpiar filtros</button>
    </div>

    <section class="novedades">
      <div class="grid-productos" id="productos"></div>
      <div class="estado-vacio" id="sin-resultados" hidden>
        <h2>No encontramos productos con esos filtros</h2>
        <p>Prueba con otra búsqueda o quita algún filtro.</p>
      </div>
    </section>

    <nav class="navbar" aria-label="Navegación principal">
        <a href="index.html" class="nav-item">
            <span>🏠</span>
            <p>Inicio</p>
        </a>
        <a href="comparacion.html" class="nav-item" data-badge="compare" data-label="Comparación">
            <span>⚖️</span>
            <p>Comparar</p>
        </a>
        <a href="carrito.html" class="nav-item" data-badge="cart">
            <span>🛒</span>
            <p>Carrito</p>
        </a>
        <a href="Perfil.html" class="nav-item">
            <span>👤</span>
            <p>Perfil</p>
        </a>
    </nav>

    <script src="js/core.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/services.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pages/catalogo.js"></script>
</body>
</html>
