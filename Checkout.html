<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkout</title>
    <link rel="stylesheet" href=" css/checkout.css">
</head>
<body>
    <header class="header">
        <a href="carrito.html" class=" icon volver">🔙</a>
        <h1 class="titulo">Checkout</h1>
    </header>
    <main class="registro">
    <h2>Envio</h2>
    <div class="form-style">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre"  placeholder="Ingrese su nombre">
        
        <label for="direccion"> Dirección</label>
        <input type="text"  id="direccion" placeholder="Ingrese su direccion">

        <label for="ciudad"> Ciudad</label>
        <input type="text" id="ciudad" placeholder="Ciudad">
    </div>
    <section class="pago">
        <h2>Metodo de pago</h2>
        <div class="cards">
            <div class="card">Efectivo</div>
            <div class="card">Mastercard</div>
            <div class="card">PayPal</div>
        </div>
    </section>
    </main>
    <section class="style">
        <button class="pay">Cantidad a Pagar</button>
        
    </section>
</body>
</html>
