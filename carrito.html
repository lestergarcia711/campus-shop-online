<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>carrito</title>
    <link rel="stylesheet" href="css/carrito.css">
</head>
<body>
    <header class="header">

        <a href="detalles.html" class=" icon volver">🔙</a>
        <h1 class="titulo">Mi carrito</h1>
      
    </header>
    <main class="eleccion">
        <div class="card">
            <img src="img/camisa-polo.jpeg" alt="Camisa polo">
            <h3>Camisa Polo</h3>
            <p> cod#234</cod></p>
            <p class="precio">Q45.00</p>
            <button class="eliminar">🗑️</button>
            <div class="add">
                <button>-</button><button>1</button><button>+</button>
            </div>
        </div>
        
         <div class="card">
           <img src="img/jacket.jpeg" alt="Chaqueta">
             <h3>Chaqueta de Cuero</h3>
             <p> cod#123</cod></p>
             <p class="precio">Q120.00</p>
             <button class="eliminar">🗑️</button>
             <div class="add">
                <button>-</button><button>1</button><button>+</button>
            </div>

         </div>
         <section class="compra">
            <h2>Total</h2><p class="precio">Q165.00</p>
            <button class="checkout"><a href="Checkout.html"></a> Finalizar Compra</button>
         </section>

    </main>
    
</body>
</html>
