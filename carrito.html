<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi carrito | CampusShop</title>
    <link rel="stylesheet" href="css/carrito.css">
    <link rel="stylesheet" href="css/funcional.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header class="header">

        <a href="catalogo.html" class="icon volver" aria-label="Seguir comprando">🔙</a>
        <h1 class="titulo">Mi carrito</h1>

    </header>

    <noscript><p>El carrito necesita JavaScript.</p></noscript>

    <p class="resumen-carrito" id="resumen-carrito"></p>

    <main class="eleccion">
        <div id="lineas" class="eleccion">
            <p class="estado">Cargando tu carrito…</p>
        </div>

        <section class="compra">
            <h2>Total</h2>
            <p class="precio" id="total">Q0.00</p>
            <a class="checkout" href="Checkout.html">Finalizar compra</a>
        </section>
    </main>

    <script src="js/core.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/services.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pages/carrito.js"></script>
</body>
</html>
