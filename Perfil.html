<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | CampusShop</title>
    <style>
        body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
}

header {
    text-align: center;
    padding: 10px;
}

.container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 90vh;
}

.card {
    background: white;
    width: 280px;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.profile {
    text-align: center;
    margin-bottom: 20px;
}

.avatar {
    width: 80px;
    height: 80px;
    background: #e0c3a3;
    border-radius: 50%;
    margin: 0 auto 10px;
    border: 3px solid #b7e4c7;
}

.profile h2 {
    margin: 5px 0;
    font-size: 18px;
}

.profile p {
    font-size: 12px;
    color: gray;
}

.options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.option {
    background: #f1f1f1;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    font-size: 14px;
    cursor: pointer;
}

.option:hover {
    background: #e0e0e0;
}

.logout {
    color: red;
}
/*estilos para la barra de navegacion*/
.navbar {
    position: fixed;
    bottom: 0;
    width: 100%;
     background: #046366;
    display: flex;
    justify-content: space-around;
    align-items: center;
    border-top: 1px solid #ddd;
    padding: 8px 0;
}

.nav-item {
    text-decoration: none;
    color: white;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.nav-item span {
    font-size: 18px;
}

.nav-item.active {
    color: black;
    font-weight: bold;
}
    </style>
    <link rel="stylesheet" href="css/funcional.css">
</head>
<body class="perfil">
    <header class="header">
        <h1>Perfil</h1>
    </header>
    <main class="container">
    <noscript><p>El perfil necesita JavaScript.</p></noscript>
    <div class="card perfil-card">

        <div class="profile">
            <div class="avatar" id="avatar" aria-hidden="true">?</div>
            <h2 id="perfil-nombre">Tu perfil</h2>
            <p id="perfil-email"></p>
        </div>

        <form class="form-perfil" id="form-perfil" novalidate>
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" autocomplete="name" maxlength="80">
            <p class="error-campo" id="error-nombre" role="alert"></p>

            <label for="email">Correo</label>
            <input type="email" id="email" autocomplete="email" maxlength="120">
            <p class="error-campo" id="error-email" role="alert"></p>

            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" autocomplete="tel" maxlength="20">
            <p class="error-campo" id="error-telefono" role="alert"></p>

            <label for="direccion">Dirección de envío</label>
            <input type="text" id="direccion" autocomplete="street-address" maxlength="160">
            <p class="error-campo" id="error-direccion" role="alert"></p>

            <label for="ciudad">Ciudad</label>
            <input type="text" id="ciudad" autocomplete="address-level2" maxlength="60">
            <p class="error-campo" id="error-ciudad" role="alert"></p>

            <button type="submit" class="btn">Guardar cambios</button>
        </form>

        <div class="perfil-enlaces">
            <a href="Historial.html">Mis pedidos</a>
            <a href="comparacion.html">Comparación</a>
            <button type="button" class="peligro" id="borrar-datos">Borrar mis datos</button>
        </div>

    </div>
</main>
<nav class="navbar" aria-label="Navegación principal">
    <a href="index.html" class="nav-item">
        <span>🏠</span>
        <p>Inicio</p>
    </a>
    <a href="catalogo.html" class="nav-item">
        <span>📦</span>
        <p>Catálogo</p>
    </a>
    <a href="carrito.html" class="nav-item" data-badge="cart">
        <span>🛒</span>
        <p>Carrito</p>
    </a>
    <a href="Perfil.html" class="nav-item active">
        <span>👤</span>
        <p>Perfil</p>
    </a>
    <a href="Historial.html" class="nav-item">
        <span>🕒</span>
        <p>Historial</p>
    </a>
</nav>
    
    <script src="js/core.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/services.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pages/perfil.js"></script>
</body>
</html>
