<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparar productos | CampusShop</title>
    <link rel="stylesheet" href="css/comparacion.css">
    <link rel="stylesheet" href="css/funcional.css">
</head>
<body>
    <header class="header">
        <a href="catalogo.html" class="icon volver" aria-label="Volver al catálogo">🔙</a>
        <h1 class="titulo">Comparar productos</h1>
    </header>

    <noscript><p>La comparación necesita JavaScript.</p></noscript>

    <main class="main">
        <div class="comparar-barra">
            <span id="pista" hidden>Agrega al menos un producto más desde el catálogo para compararlos.</span>
            <button type="button" class="enlace-limpiar" id="vaciar" hidden>Vaciar lista</button>
        </div>

        <div class="comparacion" id="comparacion" hidden></div>

        <div class="estado-vacio" id="sin-comparacion">
            <h2>Aún no elegiste productos</h2>
            <p>En el catálogo toca «Comparar» en los productos que te interesen (hasta 4).</p>
            <a class="btn" href="catalogo.html">Ir al catálogo</a>
        </div>
    </main>

    <script src="js/core.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/services.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pages/comparacion.js"></script>
</body>
</html>
