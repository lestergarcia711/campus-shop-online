<!DOCTYPE html>

<head>

    <STYle>
body{
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
}
 .header{
    text-align: center;
    padding: 10px;

        }
.titulo{
    font-size: 24px;
    color: #333;
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
}

 .container {
    padding: 20px;
}

.card {
    background: #f5f5f5;
    padding: 15px;
    border-radius: 15px;
}

.order {
    background: white;
    border-radius: 12px;
    padding: 12px;
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.order-info h3 {
    margin: 0;
    font-size: 14px;
}

.order-info p {
    margin: 3px 0;
    font-size: 12px;
    color: gray;
}

.price {
    font-weight: bold;
}

button {
    margin-top: 5px;
    padding: 5px 10px;
    border: none;
    background: #ddd;
    border-radius: 8px;
    cursor: pointer;
}

/* Estados */
.status {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 10px;
    font-size: 11px;
    margin-top: 5px;
}

.entregado {
    background: #d4f8d4;
    color: green;
}

.camino {
    background: #fff3cd;
    color: #856404;
}

.cancelado {
    background: #f8d7da;
    color: red;
}
/*estilos para la barra de navegacion*/
.navbar {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #046366;
    color: white;
    display: flex;
    justify-content: space-around;
    align-items: center;
    border-top: 1px solid #ddd;
    padding: 8px 0;
}

.nav-item {
    text-decoration: none;
    color: white;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.nav-item span {
    font-size: 18px;
}

.nav-item.active {
    color: black;
    font-weight: bold;
}
    </STYle>
